<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Auction Tools</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #161616;
      color: #f4f6f4;
    }

    .card {
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 14px;
      background: #1e1e1e;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 12px;
      color: #00ff66;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 11px;
      color: #00ff66;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    p {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #d7d7d7;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .setting-label {
      font-size: 12px;
      color: #d7d7d7;
    }

    .setting-input {
      width: 70px;
      padding: 6px 8px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font-size: 13px;
      text-align: center;
    }

    .setting-input:focus {
      outline: none;
      border-color: #00ff66;
    }

    .save-btn {
      width: 100%;
      padding: 8px;
      border: 1px solid #00ff66;
      border-radius: 6px;
      background: #184628;
      color: #00ff66;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .save-btn:hover {
      background: #1a5c30;
    }

    .status {
      text-align: center;
      font-size: 11px;
      color: #00ff66;
      margin-top: 8px;
      min-height: 14px;
    }

    .help-text {
      font-size: 10px;
      color: #888;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      border-radius: 24px;
      transition: 0.3s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .toggle-slider {
      background-color: #00ff66;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Auction Tools</h1>
    <p>The floating panel is active on the auction page. The timer now uses your local file `assets/TIMER.mp3`.</p>
  </div>

  <div class="card">
    <h2>Settings</h2>
    <div class="setting-row">
      <span class="setting-label">Bid Estimate Divisor</span>
      <input type="number" id="divisor-input" class="setting-input" value="1.3" step="0.1" min="0.1">
    </div>
    <div class="setting-row">
      <span class="setting-label">Seller Name Suffix</span>
      <input type="text" id="seller-suffix-input" class="setting-input" placeholder="e.g. 1" style="width: 70px;">
    </div>
    <div class="setting-row">
      <span class="setting-label">Facebook Quick Note</span>
      <label class="toggle-switch">
        <input type="checkbox" id="fb-note-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <button id="save-btn" class="save-btn">Save Settings</button>
    <div id="status" class="status"></div>
    <p class="help-text">Bid Estimate = Estimate / Divisor. Default is 1.3. Change this value to adjust the calculation.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
